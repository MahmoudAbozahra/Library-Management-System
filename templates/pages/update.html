{% extends "base.html" %}

{% block content %}
<div class="page-stack">
    <section class="form-panel">
        <p class="eyebrow-blue">تحديث الكتالوج</p><h2>تعديل كتاب: {{ book.title }}</h2><p class="form-intro">حدّث بيانات الكتاب وحالته المسجلة.</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}{{ form.as_p }}
            <div class="form-actions"><button class="button" type="submit">حفظ التغييرات</button><a class="button button-secondary" href="{% url 'index' %}">إلغاء</a></div>
        </form>
    </section>
</div>
{% endblock %}
