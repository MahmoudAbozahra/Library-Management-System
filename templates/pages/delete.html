{% extends "base.html" %}

{% block content %}
<div class="page-stack">
    <section class="form-panel confirm-panel">
        <span class="confirm-icon"><i class="fas fa-trash-alt" aria-hidden="true"></i></span>
        <p class="eyebrow-blue">تأكيد الإجراء</p><h2>حذف الكتاب</h2><p class="form-intro">هل تريد حذف «{{ book.title }}»؟ لا يمكن التراجع عن هذا الإجراء.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions"><button class="button button-danger" type="submit">نعم، احذف الكتاب</button><a class="button button-secondary" href="{% url 'index' %}">إلغاء</a></div>
        </form>
    </section>
</div>
{% endblock %}
